name: Scrape events

on:
  schedule:
    # Three times daily — 07:00, 13:00, 19:00 Atlantic Standard Time
    # (UTC-4). GitHub Actions cron runs on UTC and does not follow DST,
    # so during Atlantic Daylight Time (summer) these fire one local
    # hour later: 08:00 / 14:00 / 20:00 ADT.
    - cron: "0 11,17,23 * * *"
  workflow_dispatch:

permissions:
  # Scopes not listed here are set to none, so contents: write must stay
  # even though only the issue step needs issues: write. Per GitHub's
  # docs, `issues` is the scope covering issue creation, labels and
  # assignees — there is no narrower one.
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # parser_run_history.json is how scrape.py notices a parser that has
      # gone quiet (see the staleness warning in scrape.py). It's gitignored,
      # and every run checks out clean, so without a cache the history would
      # be empty on each run and the warning could never fire here.
      #
      # The key is unique per run so the cache always misses and this job
      # saves a fresh copy at the end; restore-keys then loads the most
      # recent previous one. That's the rolling-cache idiom — a fixed key
      # would restore the first-ever history forever and never update.
      - name: Restore parser run history
        uses: actions/cache@v6
        with:
          path: parser_run_history.json
          key: parser-run-history-${{ github.run_id }}
          restore-keys: |
            parser-run-history-

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit & push if events.json changed
        run: |
          if git diff --quiet -- events.json; then
            echo "events.json unchanged — nothing to commit."
            exit 0
          fi

          # Bump sw.js CACHE_VERSION using the lunapp-vN convention so this
          # workflow stays aligned with the local pre-commit hook
          # (hooks/pre-commit). The script handles both increment and
          # re-anchor cases — see scripts/bump-cache-version.py.
          python scripts/bump-cache-version.py

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html is rewritten by scrape.py (JSON-LD + noscript blocks),
          # so it travels with events.json on every update.
          git add events.json sw.js index.html
          git commit -m "Update events [automated]"

          # Re-sync with main right before pushing: another commit may have
          # landed between this job's checkout and now (a dev pushing a code
          # change, or a fast-following manual workflow_dispatch). Rebasing
          # our single bot commit on top is safe because only this workflow
          # writes events.json / CACHE_VERSION, so no real merge conflict
          # can arise from human-authored commits.
          git pull --rebase origin main
          git push

      # A stale parser is only useful news if someone sees it, and a WARNING
      # in this log reaches nobody. scrape.py decides who is newly stale (one
      # issue per streak, reset when the parser recovers) and writes
      # stale_parsers.json; this step only delivers. The issue is assigned
      # because assignment is what generates the notification email —
      # opening alone may not.
      #
      # Runs last and can never fail the job: events.json is already
      # committed and pushed above, and a notification problem must not be
      # reported as a scrape failure. `if: always()` so a stale parser is
      # still reported when an earlier step failed.
      - name: Open issues for newly stale parsers
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f stale_parsers.json ]; then
            echo "No stale_parsers.json — nothing to report."
            exit 0
          fi

          total=$(jq -r '.parsers | length' stale_parsers.json 2>/dev/null || echo 0)
          if [ "$total" = "0" ] || [ -z "$total" ]; then
            echo "No newly stale parsers this run."
            exit 0
          fi
          echo "$total parser(s) newly stale."

          # Idempotent: fails harmlessly when the label already exists.
          gh label create parser-stale \
            --color B60205 \
            --description "A source parser has returned no events for several consecutive runs" \
            >/dev/null 2>&1 \
            && echo "Created parser-stale label." \
            || echo "parser-stale label already exists (or could not be created)."

          # One pull of open issues, reused for every duplicate check below.
          open_titles=$(gh issue list --state open --limit 200 --json title 2>/dev/null \
            || echo '[]')

          jq -c '.parsers[]' stale_parsers.json | while read -r row; do
            name=$(echo "$row"   | jq -r '.parser')
            streak=$(echo "$row" | jq -r '.streak')
            last=$(echo "$row"   | jq -r '.last_nonzero // "unknown (not in retained history)"')
            title="Stale parser: ${name}"

            # Guards against a duplicate when the actions/cache entry was
            # evicted and the "already notified" flag went with it.
            dupes=$(echo "$open_titles" \
              | jq --arg t "$title" '[.[] | select(.title == $t)] | length' 2>/dev/null \
              || echo 0)
            if [ "$dupes" != "0" ]; then
              echo "Open issue already exists for ${name} — skipping."
              continue
            fi

            body=$(printf '%s\n' \
              "The \`${name}\` parser has returned **0 events for ${streak} consecutive runs**." \
              "" \
              "| | |" \
              "|---|---|" \
              "| Parser | \`${name}\` |" \
              "| Zero streak | ${streak} runs |" \
              "| Last returned events | ${last} |" \
              "| Detected by | [this workflow run](${RUN_URL}) |" \
              "" \
              "This may be a broken parser (the source site changed) or a legitimately quiet source (season over, nothing scheduled). Run it in isolation to tell them apart:" \
              "" \
              '```' \
              "cd scraper && python -c \"import requests, sys; sys.path.insert(0,'.'); from parsers import ${name} as p; print(len(p.fetch(session=requests.Session())))\"" \
              '```' \
              "" \
              "Closing this issue is enough if the source is simply quiet — a new issue only opens if the parser produces events again and then goes stale a second time." \
            )

            if gh issue create --title "$title" --body "$body" \
                 --label parser-stale --assignee mycarta >/dev/null 2>&1; then
              echo "Opened issue: ${title}"
            elif gh issue create --title "$title" --body "$body" >/dev/null 2>&1; then
              # Label or assignee rejected (e.g. assignee not a collaborator):
              # a plain issue is still better than silence.
              echo "Opened issue without label/assignee: ${title}"
            else
              echo "WARNING: could not open issue for ${name}; continuing."
            fi
          done

          exit 0
