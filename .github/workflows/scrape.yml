name: Scrape events

on:
  schedule:
    # Twice daily — 06:00 and 18:00 Atlantic Standard Time (UTC-4).
    # GitHub Actions cron runs on UTC and does not follow DST, so during
    # Atlantic Daylight Time (summer) these fire one local hour later.
    - cron: "0 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit & push if events.json changed
        run: |
          if git diff --quiet -- events.json; then
            echo "events.json unchanged — nothing to commit."
            exit 0
          fi

          # Bump sw.js CACHE_VERSION using the lunapp-vN convention so this
          # workflow stays aligned with the local pre-commit hook
          # (hooks/pre-commit). The script handles both increment and
          # re-anchor cases — see scripts/bump-cache-version.py.
          python scripts/bump-cache-version.py

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html is rewritten by scrape.py (JSON-LD + noscript blocks),
          # so it travels with events.json on every update.
          git add events.json sw.js index.html
          git commit -m "Update events [automated]"

          # Re-sync with main right before pushing: another commit may have
          # landed between this job's checkout and now (a dev pushing a code
          # change, or a fast-following manual workflow_dispatch). Rebasing
          # our single bot commit on top is safe because only this workflow
          # writes events.json / CACHE_VERSION, so no real merge conflict
          # can arise from human-authored commits.
          git pull --rebase origin main
          git push
