name: Scrape events

on:
  schedule:
    # Twice daily — 06:00 and 18:00 Atlantic Standard Time (UTC-4).
    # GitHub Actions cron runs on UTC and does not follow DST, so during
    # Atlantic Daylight Time (summer) these fire one local hour later.
    - cron: "0 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Opt into Node.js 24 for JavaScript actions ahead of the June 2 default
# switchover — silences the deprecation warning and avoids a surprise break.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit & push if events.json changed
        run: |
          if git diff --quiet -- events.json; then
            echo "events.json unchanged — nothing to commit."
            exit 0
          fi

          # CACHE_VERSION = short SHA of the commit that triggered this run.
          # Since each scrape produces a fresh commit, GITHUB_SHA on the next
          # run is always different from the SHA baked into the deployed sw.js,
          # which is what lets clients invalidate their caches.
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i -E "s/^const CACHE_VERSION = \".*\";/const CACHE_VERSION = \"${SHORT_SHA}\";/" sw.js

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json sw.js
          git commit -m "Update events [automated]"
          git push
